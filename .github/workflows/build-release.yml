name: Build PB FrameFlux Artifacts

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  build-matrix:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86-64-v2, x86-64-v3, x86-64-v4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vulkan SDK & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-12 libvulkan-dev vulkan-tools curl unzip

      - name: Install Slang Compiler (slangc)
        run: |
          SLANG_VERSION="2025.23.1"
          echo "[+] Downloading Slang v${SLANG_VERSION}..."
          curl -fL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.zip" -o slang.zip
          unzip -q slang.zip -d slang
          sudo cp slang/bin/slangc /usr/local/bin/
          sudo cp slang/lib/libslang*.so /usr/local/lib/ || true
          sudo ldconfig
          slangc -version

      - name: Configure CMake (Native Matching Build)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DFRAMEFLUX_ARCH=${{ matrix.arch }}

      - name: Compile PB FrameFlux
        run: cmake --build build --parallel $(nproc)

      - name: Strip Binary
        run: strip --strip-unneeded build/libVkLayer_projectbig_frameflux.so

      - name: Package Architecture Tarball
        run: |
          DIST_DIR="PB-FrameFlux-${{ matrix.arch }}"
          mkdir -p "$DIST_DIR"
          cp build/libVkLayer_projectbig_frameflux.so "$DIST_DIR/"
          cp build/VkLayer_projectbig_frameflux.json "$DIST_DIR/"
          cp install.sh "$DIST_DIR/" 2>/dev/null || true
          cp LICENSE* "$DIST_DIR/" 2>/dev/null || true
          tar -czvf "PB-FrameFlux-${{ matrix.arch }}.tar.gz" "$DIST_DIR"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PB-FrameFlux-${{ matrix.arch }}
          path: "PB-FrameFlux-${{ matrix.arch }}.tar.gz"